# Build definition for naht.dev — a static site served straight from disk by the
# shared `edge` nginx reverse proxy (separate repo, EDGE_SITE=white). There is
# NO runtime server here: this stack builds the site, copies the artifacts onto
# the host, and exits. Nothing stays resident — zero idle RAM, no host port, no
# `web` network membership.
#
# Deploy by hand on the host:
#   docker compose up --build      # builds, copies ./dist, container exits 0
# The edge serves ./dist as /var/www/naht (mounted read-only); rebuild to
# publish a new version and edge picks it up immediately (no reload needed).
#
# There is intentionally no auto-deploy / webhook / CI push.

services:
  naht_build:
    build:
      context: .
      dockerfile: Dockerfile
    image: naht-build:latest
    container_name: naht_build
    # Disposable: wipe the target and copy the freshly built dist onto the host,
    # then stop. `-a` preserves the pre-compressed .gz alongside each asset.
    command: sh -c "rm -rf /out/* && cp -a /app/dist/. /out/"
    volumes:
      - ./dist:/out
